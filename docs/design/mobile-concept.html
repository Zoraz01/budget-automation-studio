<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0d12" />
    <title>BAS · Complete mobile design preview</title>
    <link rel="stylesheet" href="preview.css" />
    <script src="catalog.js" defer></script>
    <script src="preview.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <aside class="design-bar">
      <span
        ><b>BAS / DESIGN LAB</b
        ><small>Synthetic preview · no accounts connected</small></span
      ><button data-action="coverage">Coverage map</button
      ><label
        >Preview state<select id="state">
          <option value="ready">Ready</option>
          <option value="loading">Loading</option>
          <option value="empty">Empty</option>
          <option value="error">Error</option>
          <option value="stale">Stale</option>
          <option value="offline">Offline</option>
          <option value="locked">Session expired</option>
        </select></label
      >
    </aside>
    <div class="phone">
      <header class="top">
        <button class="brand quiet" data-page="home">
          <svg
            width="32"
            height="32"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 96 96"
          >
            <rect width="96" height="96" rx="28" fill="#12161d" />
            <path
              d="M33 43 19 32v32l14-11c12 15 30 15 45-5-15-20-33-20-45-5Z"
              fill="#10b981"
            />
            <path d="m43 34 11-12 8 13M43 62l11 12 8-13" fill="#6ee7b7" />
            <path
              d="M42 48c7-8 15-8 23-3"
              fill="none"
              stroke="#0a0d12"
              stroke-width="3"
              stroke-linecap="round"
            />
            <circle cx="68" cy="44" r="3" fill="#0a0d12" /></svg
          >BAS
        </button>
        <div class="row">
          <button
            class="icon-button"
            data-action="privacy"
            aria-label="Toggle amount privacy"
          ></button
          ><button
            class="icon-button"
            data-page="chat"
            aria-label="Open saved AI conversations"
          ></button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <nav id="nav" aria-label="Primary navigation"></nav>
    </div>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button
          class="icon-button"
          data-action="close"
          aria-label="Close dialog"
        >
          ✕
        </button>
      </header>
      <div id="sheet-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
